spring.application.name=subastas-api

server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/subastas
spring.datasource.username=postgres
spring.datasource.password=1234

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# JWT

# Cuando se suba a render se reemplaza esta clave
jwt.secret=miClaveSuperSecretaParaJWTQueDebeTenerAlMenos32Caracteres
jwt.expiration=86400000