

services:
  postgres:
    image: postgres:17
    container_name: subastas-postgres
    restart: always
    environment:
      POSTGRES_DB: subastas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: